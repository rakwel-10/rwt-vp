<!doctype html><meta charset="utf-8"><title>film check</title>
<link rel="stylesheet" href="../assets/css/idecide.css">
<link rel="stylesheet" href="../assets/css/music.css">
<pre id="out">running…</pre>
<script>window.IDECIDE_CONFIG={funnel:null,handoff:{webhookUrl:''},debug:{validateOnLoad:false}};</script>
<script src="../data/funnel.js"></script>
<script src="../assets/js/blocks.js"></script>
<script src="../assets/js/music.js"></script>
<script src="../assets/js/engine.js"></script>
<script>
const r=[]; const ok=(n,c,d)=>r.push((c?'PASS':'FAIL')+'  '+n+(d?'  ['+d+']':''));
const sleep=ms=>new Promise(x=>setTimeout(x,ms));

/* Every film now carries real footage, so there is no placeholder
   clock left to sit through. The decode is verified for real; the
   moment the film ends is then driven directly, because a headless
   browser's virtual clock does not advance playback and waiting on
   it would only ever measure Chrome. */

(async()=>{
  try{sessionStorage.clear()}catch(e){}
  IDecide.start(); await sleep(600);

  /* ---------- the title card and the countdown ------------------ */
  location.hash='/S1'; await sleep(700);

  const film=document.querySelector('.film');
  const card=document.querySelector('.titlecard');
  const reel=document.querySelector('.reel');
  const choices=document.querySelector('.choices');

  ok('there is a title card', !!card);
  ok('it carries the slide line', /most expensive thing in Richmond/.test(card.textContent));
  ok('the card is up', film.classList.contains('is-carding'));
  ok('the picture is still dark', parseFloat(getComputedStyle(reel).opacity)<0.1,
     'reel opacity '+getComputedStyle(reel).opacity);
  ok('nothing is playing yet', !reel.classList.contains('reel--playing'));

  const numeral=card.querySelector('.countdown__n');
  ok('there is a countdown', !!numeral);
  await sleep(500);
  ok('it counts from three', numeral.textContent==='3', 'showing "'+numeral.textContent+'"');
  await sleep(900);
  ok('then two', numeral.textContent==='2', 'showing "'+numeral.textContent+'"');
  await sleep(900);
  ok('then one', numeral.textContent==='1', 'showing "'+numeral.textContent+'"');

  await sleep(1200);
  ok('the card gives way', film.classList.contains('is-rolling'));
  ok('the picture is no longer held back', !film.classList.contains('is-carding'));

  /* ---------- the footage is real and it decodes ---------------- */
  const v=reel.querySelector('video');
  ok('S1 has a video element', !!v);
  ok('S1 points at its file', v && /ID-J1\.mp4$/.test(v.getAttribute('src')),
     v ? v.getAttribute('src') : 'none');
  ok('the browser accepts the codec',
     v && v.canPlayType('video/mp4; codecs="avc1.42E01E"') !== '');

  /* Whether the file downloads in time is not decided here - a
     virtual clock starves the network, so a 32MB fetch never lands.
     tools/media.html checks that in real time. What matters here is
     that playback was attempted and the engine handled the outcome:
     either it rolled, or it fell back to a play button as designed. */
  const rolled = reel.classList.contains('reel--playing');
  const handedBack = !document.querySelector('.reel__play').hidden;
  ok('playback was attempted and resolved', rolled || handedBack,
     rolled ? 'rolling' : 'handed back to a play button');
  ok('skip is offered while it rolls', !rolled || !document.querySelector('.reel__skip').hidden);
  ok('button is held back while it plays', choices.hidden===true);

  /* ---------- the controls -------------------------------------- */
  const rc=reel.querySelector('.rc');
  ok('there is a control bar', !!rc);
  ok('it has play, seek, time, mute and fullscreen',
     !!rc.querySelector('.rc__toggle') && !!rc.querySelector('.rc__seek') &&
     !!rc.querySelector('.rc__time') && !!rc.querySelector('.rc__mute') &&
     !!rc.querySelector('.rc__full'));
  ok('the bar only exists once the film is running', rc.hidden===false);

  const seekEl=rc.querySelector('.rc__seek');
  ok('the scrubber is a real range input, so arrows work',
     seekEl.tagName==='INPUT' && seekEl.type==='range');
  ok('every control is labelled',
     ['.rc__toggle','.rc__mute','.rc__full','.rc__seek']
       .every(sel=>(rc.querySelector(sel).getAttribute('aria-label')||'').length>1));

  /* Out of the way while it runs, pinned open when paused. The class
     is set explicitly here: whether autoplay actually started is a
     browser decision and not what this is testing. */
  const wasPaused = reel.classList.contains('is-paused');
  const thin = reel.querySelector('.reel__bar');
  /* Read the rule, not the fade: a CSS transition does not advance
     under a virtual clock, so opacity would sit at its start value
     however long the test waited. */
  const settled = (node, cls, on) => {
    const prev = node.style.transition;
    node.style.transition = 'none';
    reel.classList.toggle(cls, on);
    void node.offsetWidth;
    const o = getComputedStyle(node).opacity;
    node.style.transition = prev;
    return o;
  };
  ok('the bar keeps out of the way while it plays',
     settled(rc, 'is-paused', false)==='0');
  ok('a paused film shows its controls',
     settled(rc, 'is-paused', true)==='1');
  ok('the thin progress line steps aside for the full bar',
     settled(thin, 'is-paused', true)==='0');
  reel.classList.toggle('is-paused', wasPaused);

  ok('the toggle reads as play while paused',
     rc.querySelector('.rc__toggle').getAttribute('aria-label')==='Play' ||
     rc.querySelector('.rc__toggle').getAttribute('aria-label')==='Pause');
  const muteBtn=rc.querySelector('.rc__mute');
  const wasMuted=v.muted;
  muteBtn.click();
  ok('mute toggles the video', v.muted!==wasMuted);
  muteBtn.click();
  ok('and toggles back', v.muted===wasMuted);

  /* ---------- the end of the film ------------------------------- */
  v.dispatchEvent(new Event('ended'));
  await sleep(700);

  ok('button appears at the end', choices.hidden===false);
  ok('button is actually on screen', choices.getBoundingClientRect().height>20);
  ok('the picture steps back behind it', film.classList.contains('is-ended'));
  ok('skip is withdrawn', document.querySelector('.reel__skip').hidden);
  ok('it did not auto-advance', location.hash==='#/S1');

  const btn=choices.querySelector('.choice').getBoundingClientRect();
  const frame=reel.getBoundingClientRect();
  ok('the button is centred on the frame',
     Math.abs((btn.left+btn.right)/2-(frame.left+frame.right)/2)<3,
     'button '+Math.round((btn.left+btn.right)/2)+' vs frame '+Math.round((frame.left+frame.right)/2));
  ok('and vertically centred too',
     Math.abs((btn.top+btn.bottom)/2-(frame.top+frame.bottom)/2)<3,
     'button '+Math.round((btn.top+btn.bottom)/2)+' vs frame '+Math.round((frame.top+frame.bottom)/2));
  ok('the frame is nearly the whole screen',
     frame.height>window.innerHeight*0.75, Math.round(frame.height)+' of '+window.innerHeight);
  ok('but keeps a margin of dark', frame.top>8 && frame.left>8);
  ok('everything fits without scrolling', btn.bottom<=window.innerHeight+2);

  /* ---------- the other two films ------------------------------- */
  for (const [slide, file] of [['S2','ID-J2'], ['S6','ID-J3']]) {
    location.hash='/'+slide; await sleep(700);
    const el=document.querySelector('.reel video');
    ok(slide+' points at its file', !!el && new RegExp(file+'\\.mp4$').test(el.getAttribute('src')),
       el ? el.getAttribute('src') : 'no video element');
    ok(slide+' has a title card', !!document.querySelector('.titlecard'));
    ok(slide+' has no production chrome', !document.querySelector('.reel__meta'));
  }

  /* ---------- the film behind the sign-in ----------------------- */
  location.hash='/welcome'; await sleep(800);
  const bgv=document.querySelector('.bg video');
  ok('the sign-in has a background film', !!bgv && /ID-rwt2\.mp4$/.test(bgv.getAttribute('src')),
     bgv ? bgv.getAttribute('src') : 'no background video');
  ok('it is muted and looping', !!bgv && bgv.muted && bgv.loop);
  ok('it is hidden from assistive tech',
     document.querySelector('.bg').getAttribute('aria-hidden')==='true');

  location.hash='/S3'; await sleep(600);
  ok('the background film is dropped on other slides', !document.querySelector('.bg'));

  const fails=r.filter(x=>x.startsWith('FAIL'));
  document.title = fails.length ? 'FAILED '+fails.length : 'ALL PASS '+r.length;
  document.body.innerHTML='<pre id="out">'+document.title+'\n\n'+r.join('\n')+'</pre>';
})();
</script>
