# Deploys the funnel to radiantwavelounge.com (GoDaddy cPanel hosting) over FTPS
# on every push to main, or by hand from the Actions tab ("Run workflow").
#
# Needs four repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER      e.g. ftp.radiantwavelounge.com  (host only, no ftp://)
#   FTP_USERNAME    the cPanel FTP account
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  the site folder as FileZilla shows it, ending in a slash -
#                   "/" when the FTP account opens straight into the site folder
#
# Only changed files are sent: the action keeps .ftp-deploy-sync-state.json on
# the server to know what is already there. It never deletes files it did not
# upload itself.

name: Deploy to GoDaddy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-godaddy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Secrets pasted into GitHub easily pick up a stray space, line break
      # or ftp:// prefix. Tidy them once here; later steps read the tidy
      # copies from env (still masked in logs).
      - name: Tidy FTP settings
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
          DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          RAW="$SERVER"
          SERVER=$(trim "$SERVER" | sed 's#^[a-zA-Z]*://##; s#/.*$##; s#:21$##')
          USER=$(trim "$USER"); PASS=$(printf '%s' "$PASS" | tr -d '\r\n')
          DIR=$(trim "$DIR"); [ -z "$DIR" ] && DIR=/
          case "$DIR" in /*) ;; *) DIR="/$DIR" ;; esac
          case "$DIR" in */) ;; *) DIR="$DIR/" ;; esac
          echo "::add-mask::$USER"; echo "::add-mask::$PASS"
          [ "$RAW" != "$SERVER" ] && echo "::notice::FTP_SERVER had extra characters (spaces, line breaks or ftp://) - tidied."
          echo "FTP_SERVER is ${#SERVER} characters; ends in secureserver.net: $(case "$SERVER" in *.secureserver.net) echo yes;; *) echo no;; esac)"
          {
            echo "FTP_HOST=$SERVER"
            echo "FTP_USER=$USER"
            echo "FTP_PASS<<__END_FTP_PASS__"; echo "$PASS"; echo "__END_FTP_PASS__"
            echo "FTP_DIR=$DIR"
          } >> "$GITHUB_ENV"

      # The same hosting account also serves bostonc.com. Before uploading,
      # log in and look at the target folder. Refuse if it is the top of the
      # hosting account (contains public_html) or already has a homepage that
      # is not this funnel - either way it is not radiantwavelounge.com's folder.
      - name: Check target folder
        run: |
          SERVER="$FTP_HOST"; USER="$FTP_USER"; PASS="$FTP_PASS"; DIR="$FTP_DIR"
          printf 'machine %s login %s password %s\n' "$SERVER" "$USER" "$PASS" > "$RUNNER_TEMP/netrc"
          FTP="curl -sS --ssl-reqd --netrc-file $RUNNER_TEMP/netrc"

          if ! LIST=$($FTP --list-only "ftp://$SERVER$DIR" 2>"$RUNNER_TEMP/err"); then
            ERR=$(tr '\n' ' ' < "$RUNNER_TEMP/err")
            echo "::error::Could not log in and list $DIR over FTPS. curl said: $ERR"
            # Certificate trouble is the usual GoDaddy snag: show which names the
            # server's certificate is actually issued to.
            NAMES=$(echo | timeout 20 openssl s_client -starttls ftp -connect "$SERVER:21" -servername "$SERVER" 2>/dev/null \
              | openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | tr '\n' ' ')
            echo "::error::Server certificate is issued to: ${NAMES:-could not read certificate (FTPS may not be supported)}"
            exit 1
          fi
          echo "Folder contents:"; echo "$LIST"

          if echo "$LIST" | grep -qx 'public_html'; then
            echo "::error::$DIR is the top of the hosting account, not the radiantwavelounge.com site folder."; exit 1
          fi
          if echo "$LIST" | grep -qx 'index.html\|index.php'; then
            if ! $FTP "ftp://$SERVER${DIR}index.html" 2>/dev/null | grep -q 'IDecide.start'; then
              echo "::error::$DIR already has a homepage that is not this funnel - refusing to overwrite it."; exit 1
            fi
          fi
          echo "Target folder looks right: $DIR"

      - uses: actions/checkout@v4

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PASS }}
          server-dir: ${{ env.FTP_DIR }}
          protocol: ftps
          port: 21
          timeout: 600000
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            footage-masters/**
            tools/**
            README.md
            serve.js
            serve.cmd
